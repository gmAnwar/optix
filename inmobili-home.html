<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a0a">
<title>Inmobili · Dashboard</title>
<link rel="preconnect" href="https://optix-proxy.anwarhsg.workers.dev">
<!-- §22 Paridad EnPagos: reusa enpagos-home.css para primitives de layout
     (row1-box, kpi-card, plaza-card). inmobili-home.css agrega
     branding mínimo (logo, badges Fase 2 / Próximamente) que NO existen
     en EnPagos. -->
<link rel="stylesheet" href="assets/views/enpagos-home.css">
<link rel="stylesheet" href="assets/views/inmobili-home.css">
<link rel="icon" type="image/png" href="/assets/img-inmobili-logo.png">
</head>
<body>
<header id="home-header" class="inmobili-header">
  <div class="inmobili-brand">
    <img src="/assets/img-inmobili-logo.png" alt="Inmobili Internacional" class="inmobili-brand-logo">
    <div>
      <div class="inmobili-brand-main">Inmobili Internacional</div>
      <div id="home-subtitle" class="inmobili-brand-sub">Dashboard Operativo</div>
    </div>
  </div>
  <div id="live-pill"></div>
</header>
<!-- S91-selector — period-selector vive en su propio bar entre header y
     main; left edge a 16px (mismo padding-left que #home-main) para
     alinear con el eje X de las cards. Mirror del patrón EnPagos donde
     el selector hereda el padding 16px del #home-header. -->
<div class="inmobili-period-bar">
  <nav id="period-selector"></nav>
</div>
<main id="home-main">
  <section id="goals-section"></section>
  <section id="kpi-strip-section"></section>
  <section id="plaza-cards-section"></section>
  <section id="today-detail-section"></section>
</main>
<div id="banner-container"></div>
<script src="assets/views/inmobili-home.js"></script>
</body>
</html>
