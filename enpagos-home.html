<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EnPagos · Home</title>

<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/views/enpagos-home.css">

<style>
  /* S93 — sidebar collapsable width. Override via JS .sidebar-mock.collapsed → 48px. */
  :root { --sidebar-w: 240px; }

  /* --- MOCK SIDEBAR (copied inline from enpagos-daily.html — S92 sidebar parity) --- */
  body { margin: 0; padding: 0; }
  .app-redesign { min-height: 100vh; }

  .app-redesign .sidebar-mock {
    position: fixed;
    left: 0; top: 0;
    width: var(--sidebar-w); height: 100vh;
    background: var(--color-surface);
    border-right: 1px solid var(--color-border);
    padding: var(--space-5) var(--space-4);
    display: flex;
    flex-direction: column;
    gap: var(--space-3);
    transition: width 0.2s ease;
    overflow: hidden;
  }
  .app-redesign .sidebar-mock__brand {
    font-size: var(--font-size-lg);
    font-weight: var(--font-weight-bold);
    color: var(--color-text-primary);
    letter-spacing: -0.02em;
    padding: 0 var(--space-2);
  }
  .app-redesign .sidebar-mock__switcher {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: var(--space-2) var(--space-3);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    background: var(--color-surface);
    color: var(--color-text-primary);
    font-size: var(--font-size-sm);
    font-weight: var(--font-weight-medium);
    cursor: pointer;
    font-family: inherit;
    width: 100%;
  }
  .app-redesign .sidebar-mock__switcher:hover { border-color: var(--color-border-strong); }
  .app-redesign .sidebar-mock__switcher-caret { color: var(--color-text-tertiary); font-size: var(--font-size-xs); }
  .app-redesign .sidebar-mock__sep { border: 0; border-top: 1px solid var(--color-border); margin: var(--space-2) 0; }
  .app-redesign .sidebar-mock__views { display: flex; flex-direction: column; gap: var(--space-1); }
  .app-redesign .sidebar-mock__view {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    padding: var(--space-2) var(--space-4);
    border-radius: var(--radius-md);
    font-size: var(--font-size-sm);
    color: var(--color-text-secondary);
    cursor: pointer;
    text-decoration: none;
    border-left: 2px solid transparent;
    transition: background var(--transition-fast), color var(--transition-fast);
  }
  .app-redesign .sidebar-mock__view-icon {
    flex-shrink: 0;
    color: var(--color-text-secondary);
    transition: color var(--transition-fast);
  }
  .app-redesign .sidebar-mock__view:hover:not(.sidebar-mock__view--active):not(.sidebar-mock__view--soon) {
    background: var(--color-surface-raised); color: var(--color-text-primary);
  }
  .app-redesign .sidebar-mock__view:hover:not(.sidebar-mock__view--soon) .sidebar-mock__view-icon {
    color: var(--color-text-primary);
  }
  .app-redesign .sidebar-mock__view--active {
    background: var(--color-surface-raised);
    color: var(--color-text-primary);
    border-left: 2px solid var(--color-accent);
    padding-left: calc(var(--space-4) - 2px);
    font-weight: var(--font-weight-medium);
  }
  .app-redesign .sidebar-mock__view--active .sidebar-mock__view-icon { color: var(--color-text-primary); }
  .app-redesign .sidebar-mock__view--soon { opacity: 0.5; cursor: not-allowed; }
  .app-redesign .sidebar-mock__view--soon .sidebar-mock__view-icon { opacity: 1; }
  .app-redesign .sidebar-mock__view--soon:hover { background: transparent; color: var(--color-text-secondary); }
  .app-redesign .sidebar-mock__view .orx-sidebar-badge-soon { margin-left: auto; }
  .app-redesign .orx-sidebar-badge-soon {
    font-size: var(--font-size-xs); padding: 1px var(--space-2);
    border-radius: var(--radius-pill);
    background: var(--color-surface-raised);
    color: var(--color-text-tertiary);
    border: 1px solid var(--color-border);
    font-weight: var(--font-weight-normal); line-height: 1.4;
  }
  .app-redesign .sidebar-mock__footer {
    margin-top: auto;
    padding: var(--space-3) var(--space-2);
    border-top: 1px solid var(--color-border);
    display: flex; flex-direction: column; gap: var(--space-1);
  }
  .app-redesign .sidebar-mock__user { font-size: var(--font-size-sm); color: var(--color-text-secondary); font-weight: var(--font-weight-medium); }
  .app-redesign .sidebar-mock__signout { font-size: var(--font-size-xs); color: var(--color-text-tertiary); cursor: pointer; }

  .page-main {
    margin-left: var(--sidebar-w);
    transition: margin-left 0.2s ease;
  }

  /* S93 — sidebar collapsed state + toggle button */
  .sidebar-mock.collapsed { width: 48px; }
  .sidebar-mock__toggle {
    position: absolute; right: -11px; top: 18px;
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--color-surface); border: 1px solid var(--color-border);
    color: var(--color-text-secondary); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; line-height: 1; z-index: 101;
    transition: transform 0.2s ease;
  }
  .sidebar-mock.collapsed .sidebar-mock__toggle { transform: scaleX(-1); }
  .sidebar-mock.collapsed .sidebar-mock__view span { display: none; }
  .sidebar-mock.collapsed .sidebar-mock__view { justify-content: center; padding-left: 0; }
  .sidebar-mock.collapsed .sidebar-mock__switcher,
  .sidebar-mock.collapsed .sidebar-mock__brand,
  .sidebar-mock.collapsed .sidebar-mock__user,
  .sidebar-mock.collapsed .sidebar-mock__footer,
  .sidebar-mock.collapsed .sidebar-mock__sep { display: none; }
</style>

</head>
<body>
<div class="app-redesign">

  <aside class="sidebar-mock" aria-label="Navegación">
    <button type="button" class="sidebar-mock__toggle" aria-label="Colapsar menú">◀</button>
    <div class="sidebar-mock__brand">Optix</div>
    <button type="button" class="sidebar-mock__switcher" aria-haspopup="listbox" aria-expanded="false">
      <span>EnPagos</span>
      <span class="sidebar-mock__switcher-caret" aria-hidden="true">▾</span>
    </button>
    <hr class="sidebar-mock__sep">
    <nav class="sidebar-mock__views" aria-label="Vistas del cliente">
      <a class="sidebar-mock__view sidebar-mock__view--active" aria-current="page">
        <svg class="sidebar-mock__view-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
        <span>Home</span>
      </a>
      <a class="sidebar-mock__view" href="/enpagos-flowmap.html">
        <svg class="sidebar-mock__view-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v2.172a2 2 0 0 1-.586 1.414l-4.878 4.878A2 2 0 0 0 14 13.828V19l-4 2v-7.172a2 2 0 0 0-.586-1.414L4.536 7.536A2 2 0 0 1 4 6.172V4z"/></svg>
        <span>FlowMap</span>
      </a>
      <a class="sidebar-mock__view sidebar-mock__view--soon" aria-disabled="true">
        <svg class="sidebar-mock__view-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01"/></svg>
        <span>Semanal</span>
        <span class="orx-sidebar-badge-soon">Próximamente</span>
      </a>
      <a class="sidebar-mock__view sidebar-mock__view--soon" aria-disabled="true">
        <svg class="sidebar-mock__view-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>
        <span>Segmentación</span>
        <span class="orx-sidebar-badge-soon">Próximamente</span>
      </a>
      <a class="sidebar-mock__view sidebar-mock__view--soon" aria-disabled="true">
        <svg class="sidebar-mock__view-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>Leads</span>
        <span class="orx-sidebar-badge-soon">Próximamente</span>
      </a>
    </nav>
    <div class="sidebar-mock__footer">
      <div class="sidebar-mock__user">Usuario</div>
      <div class="sidebar-mock__signout">Cerrar sesión</div>
    </div>
  </aside>

  <div class="page-main">
    <header id="home-header">
      <div id="home-subtitle"></div>
      <div class="period-wrap" id="period-wrap">
        <div class="period-dd" id="period-dd" role="button" tabindex="0" aria-haspopup="listbox">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span id="period-label">Mes actual (MTD)</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <!-- S93: opciones generadas dinámicamente por renderPeriodSelector desde HOME_VALID_PERIODS -->
        <div class="period-menu" id="period-menu" hidden role="listbox"></div>
      </div>
      <div id="live-pill"></div>
    </header>
    <div id="home-root">
      <main id="home-main">
        <section id="goals-section"></section>
        <section id="kpi-strip-section"></section>
        <section id="plaza-cards-section"></section>
        <section id="volanteo-footnote-section"></section>
        <section id="today-detail-section"></section>
        <section id="preaut-familia-section"></section>
      </main>
      <div id="banner-container"></div>
    </div>
  </div>

</div>
<script src="assets/views/enpagos-home.js"></script>

<script>
/* OPTIX-S93-SIDEBAR-TOGGLE */
(function () {
  var KEY = 'optix_sidebar_collapsed';
  var aside = document.querySelector('.sidebar-mock');
  if (!aside) return;
  function setWidth(collapsed) {
    document.documentElement.style.setProperty('--sidebar-w', collapsed ? '48px' : '240px');
  }
  if (localStorage.getItem(KEY) === '1') { aside.classList.add('collapsed'); setWidth(true); }
  var btn = aside.querySelector('.sidebar-mock__toggle');
  if (btn) btn.addEventListener('click', function () {
    var collapsed = aside.classList.toggle('collapsed');
    setWidth(collapsed);
    localStorage.setItem(KEY, collapsed ? '1' : '0');
  });
})();
</script>
</body>
</html>
