<style>
  /* S93 — sidebar collapsable width. Override via JS .sidebar-mock.collapsed → 48px. */
  :root { --sidebar-w: 240px; }

  body { margin: 0; padding: 0; }
  .app-redesign { min-height: 100vh; }

  /* --- MOCK SIDEBAR (copied from enpagos-overview.html as-is per Sprint 2a spec) --- */
  .app-redesign .sidebar-mock {
    position: fixed;
    left: 0; top: 0;
    width: var(--sidebar-w); height: 100vh;
    background: var(--color-surface);
    border-right: 1px solid var(--color-border);
    padding: var(--space-5) var(--space-4);
    transition: width 0.2s ease;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: var(--space-3);
  }
  .app-redesign .sidebar-mock__brand {
    font-size: var(--font-size-lg);
    font-weight: var(--font-weight-bold);
    color: var(--color-text-primary);
    letter-spacing: -0.02em;
    padding: 0 var(--space-2);
  }
  .app-redesign .sidebar-mock__switcher {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: var(--space-2) var(--space-3);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    background: var(--color-surface);
    color: var(--color-text-primary);
    font-size: var(--font-size-sm);
    font-weight: var(--font-weight-medium);
    cursor: pointer;
    font-family: inherit;
    width: 100%;
  }
  .app-redesign .sidebar-mock__switcher:hover { border-color: var(--color-border-strong); }
  .app-redesign .sidebar-mock__switcher-caret { color: var(--color-text-tertiary); font-size: var(--font-size-xs); }
  .app-redesign .sidebar-mock__sep { border: 0; border-top: 1px solid var(--color-border); margin: var(--space-2) 0; }
  .app-redesign .sidebar-mock__views { display: flex; flex-direction: column; gap: var(--space-1); }
  .app-redesign .sidebar-mock__view {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    padding: var(--space-2) var(--space-4);
    border-radius: var(--radius-md);
    font-size: var(--font-size-sm);
    color: var(--color-text-secondary);
    cursor: pointer;
    text-decoration: none;
    border-left: 2px solid transparent;
    transition: background var(--transition-fast), color var(--transition-fast);
  }
  .app-redesign .sidebar-mock__view-icon {
    flex-shrink: 0;
    color: var(--color-text-secondary);
    transition: color var(--transition-fast);
  }
  .app-redesign .sidebar-mock__view:hover:not(.sidebar-mock__view--active):not(.sidebar-mock__view--soon) {
    background: var(--color-surface-raised); color: var(--color-text-primary);
  }
  .app-redesign .sidebar-mock__view:hover:not(.sidebar-mock__view--soon) .sidebar-mock__view-icon {
    color: var(--color-text-primary);
  }
  .app-redesign .sidebar-mock__view--active {
    background: var(--color-surface-raised);
    color: var(--color-text-primary);
    border-left: 2px solid var(--color-accent);
    padding-left: calc(var(--space-4) - 2px);
    font-weight: var(--font-weight-medium);
  }
  .app-redesign .sidebar-mock__view--active .sidebar-mock__view-icon { color: var(--color-text-primary); }
  .app-redesign .sidebar-mock__view--soon { opacity: 0.5; cursor: not-allowed; }
  .app-redesign .sidebar-mock__view--soon .sidebar-mock__view-icon { opacity: 1; }
  .app-redesign .sidebar-mock__view--soon:hover { background: transparent; color: var(--color-text-secondary); }
  .app-redesign .sidebar-mock__view .orx-sidebar-badge-soon { margin-left: auto; }
  .app-redesign .orx-sidebar-badge-soon {
    font-size: var(--font-size-xs); padding: 1px var(--space-2);
    border-radius: var(--radius-pill);
    background: var(--color-surface-raised);
    color: var(--color-text-tertiary);
    border: 1px solid var(--color-border);
    font-weight: var(--font-weight-normal); line-height: 1.4;
  }
  .app-redesign .sidebar-mock__footer {
    margin-top: auto;
    padding: var(--space-3) var(--space-2);
    border-top: 1px solid var(--color-border);
    display: flex; flex-direction: column; gap: var(--space-1);
  }
  .app-redesign .sidebar-mock__user { font-size: var(--font-size-sm); color: var(--color-text-secondary); font-weight: var(--font-weight-medium); }
  .app-redesign .sidebar-mock__signout { font-size: var(--font-size-xs); color: var(--color-text-tertiary); cursor: pointer; }

  /* --- Main area --- */
  .page-main {
    margin-left: var(--sidebar-w);
    padding: var(--space-5) var(--space-6);
    transition: margin-left 0.2s ease;
  }

  /* S93 — sidebar collapsed state + toggle button */
  .sidebar-mock.collapsed { width: 48px; }
  .sidebar-mock__toggle {
    position: absolute; right: -11px; top: 18px;
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--color-surface); border: 1px solid var(--color-border);
    color: var(--color-text-secondary); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; line-height: 1; z-index: 101;
    transition: transform 0.2s ease;
  }
  .sidebar-mock.collapsed .sidebar-mock__toggle { transform: scaleX(-1); }
  .sidebar-mock.collapsed .sidebar-mock__view span { display: none; }
  .sidebar-mock.collapsed .sidebar-mock__view { justify-content: center; padding-left: 0; }
  .sidebar-mock.collapsed .sidebar-mock__switcher,
  .sidebar-mock.collapsed .sidebar-mock__brand,
  .sidebar-mock.collapsed .sidebar-mock__user,
  .sidebar-mock.collapsed .sidebar-mock__footer,
  .sidebar-mock.collapsed .sidebar-mock__sep { display: none; }
  .page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: var(--space-4);
  }
  .page-title {
    font-size: var(--font-size-xl);
    font-weight: var(--font-weight-bold);
    letter-spacing: -0.02em;
  }
  .page-subtitle {
    color: var(--color-text-tertiary);
    font-size: var(--font-size-xs);
    margin-top: var(--space-1);
  }
  .theme-btn {
    width: 34px; height: 34px;
    padding: 0;
    border: 1px solid var(--color-border-strong);
    border-radius: var(--radius-md);
    background: var(--color-surface);
    color: var(--color-text-primary);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .theme-btn:hover { border-color: var(--color-accent); background: var(--color-surface-raised); }
  .theme-btn svg { display: block; }
</style>

<script src="assets/js/theme-toggle.js"></script>
</head>

<body data-role="admin">

<script>
  document.addEventListener('DOMContentLoaded', function () {
    window.EnPagosDaily.mount(document.getElementById('enpagos-daily-root'));
  });
</script>

<script>
/* OPTIX-S93-SIDEBAR-TOGGLE */
(function () {
  var KEY = 'optix_sidebar_collapsed';
  var aside = document.querySelector('.sidebar-mock');
  if (!aside) return;
  function setWidth(collapsed) {
    document.documentElement.style.setProperty('--sidebar-w', collapsed ? '48px' : '240px');
  }
  if (localStorage.getItem(KEY) === '1') { aside.classList.add('collapsed'); setWidth(true); }
  var btn = aside.querySelector('.sidebar-mock__toggle');
  if (btn) btn.addEventListener('click', function () {
    var collapsed = aside.classList.toggle('collapsed');
    setWidth(collapsed);
    localStorage.setItem(KEY, collapsed ? '1' : '0');
  });
})();
</script>

</body>
